[tools]
node = "22.21.1"
lefthook = "latest"
trivy = "latest"
gitleaks = "latest"

[settings]
node.corepack = true

[tasks.install]
description = "Install dependencies"
alias = "i"
run = "pnpm install"

[tasks.ci-install]
description = "Install dependencies for CI"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start development server (pnpm dev script)"
run = "pnpm dev"

[tasks.lint]
description = "Run ESLint"
run = "pnpm eslint ."

[tasks.lint-fix]
description = "Run ESLint with auto-fix"
run = "pnpm eslint . --fix"

[tasks.format]
description = "Run Prettier"
run = "pnpm prettier --write ."

[tasks.format-check]
description = "Check formatting without changes"
run = "pnpm prettier --check ."

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "pnpm tsc --noEmit"

[tasks.test]
description = "Run tests"
run = "pnpm test"

[tasks.audit]
description = "Check for CVE vulnerabilities (CRITICAL + HIGH)"
run = "trivy fs --severity CRITICAL,HIGH --scanners vuln --exit-code 1 ."

[tasks.leaks]
description = "Check for secrets in the codebase"
run = "gitleaks detect --source . --exit-code 1"

[tasks.leaks-staged]
description = "Check staged files for secrets"
run = "gitleaks protect --staged --redact --verbose"

[tasks.code-check]
description = "Run all quality checks (lint + format + types)"
depends = ["lint", "format-check", "typecheck"]
run = []

[tasks.setup]
description = "Install dependencies and git hooks"
depends = ["install"]
run = "lefthook install"

[tasks.docker-up]
description = "Start all services via docker compose (build + run)"
run = "docker compose up --build"

[tasks.docker-up-app]
description = "Start only the app service"
run = "docker compose up --build app"

[tasks.docker-up-server]
description = "Start only the server service"
run = "docker compose up --build server"

[tasks.docker-up-test]
description = "Start only the test (testable) service"
run = "docker compose up --build test"

[tasks.docker-down]
description = "Stop and remove docker compose containers"
run = "docker compose down"

[tasks.docker-logs]
description = "Tail logs for all docker compose services"
run = "docker compose logs -f"

[tasks.docker-logs-app]
description = "Tail logs for the app service"
run = "docker compose logs -f app"

[tasks.docker-logs-server]
description = "Tail logs for the server service"
run = "docker compose logs -f server"

[tasks.docker-logs-test]
description = "Tail logs for the test service"
run = "docker compose logs -f test"

[tasks.docker-clean]
description = "Stop containers and remove volumes/images"
run = "docker compose down -v --rmi all"

# --- Apple `container` (apple-containers.sh) -------------------------------

[tasks.apple-up]
description = "Build (if needed) and start all services via Apple container"
run = "./apple-containers.sh up"

[tasks.apple-up-app]
description = "Build (if needed) and start only the app service"
run = "./apple-containers.sh up app"

[tasks.apple-up-server]
description = "Build (if needed) and start only the server service"
run = "./apple-containers.sh up server"

[tasks.apple-up-test]
description = "Build (if needed) and start only the test service"
run = "./apple-containers.sh up test"

[tasks.apple-down]
description = "Stop and remove all Apple containers"
run = "./apple-containers.sh down"

[tasks.apple-restart]
description = "Restart all Apple containers"
run = "./apple-containers.sh restart"

[tasks.apple-build]
description = "Build all images (no run)"
run = "./apple-containers.sh build"

[tasks.apple-logs-app]
description = "Tail logs for the app service"
run = "./apple-containers.sh logs app"

[tasks.apple-logs-server]
description = "Tail logs for the server service"
run = "./apple-containers.sh logs server"

[tasks.apple-logs-test]
description = "Tail logs for the test service"
run = "./apple-containers.sh logs test"

[tasks.apple-ps]
description = "Show status of all Apple containers"
run = "./apple-containers.sh ps"

[tasks.apple-clean]
description = "Stop containers and remove images/volumes/network"
run = "./apple-containers.sh clean"
